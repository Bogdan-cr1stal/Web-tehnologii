<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Завдання 11 - 13</title>
</head>
<body>

    <h3 align="center">Анкета користувача</h3>
    <p>Дайте відповіді на наступні запитання:</p>

    <form method="POST">
        <p>Ваше ім'я: <input name="name" size="48"></p>

        <p>
            Стать чоловіча <input name="gender" type="radio" value="male"><br>
            Стать жіноча <input name="gender" type="radio" value="female">
        </p>

        <p>Діти:</p>
        <ul style="list-style-type: none;">
            <li><input name="children_yes" type="checkbox" value="yes"> Є</li>
            <li><input name="children_no" type="checkbox" value="no"> Немає</li>
        </ul>

        <p>Місто проживання:
            <select name="city">
                <option selected value="Суми">Суми</option>
                <option value="Київ">Київ</option>
                <option value="Other">Інше</option>
            </select>
        </p>

        <p>Додаткові відомості про себе:<br>
            <textarea name="text" cols="30" rows="3"></textarea>
        </p>

        <p>
            <button name="questionnaire" value="123" type="submit">Відправити</button>
            <button name="questionnaire" value="123" type="reset">Очистити форму</button>
        </p>
    </form>

</body>
</html>
